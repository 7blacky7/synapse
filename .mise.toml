[tools]
node = "20"

[tasks.dev]
description = "Start MCP dev server"
run = "pnpm run dev:mcp"

[tasks.build]
description = "Build all packages"
run = "pnpm run build"

[tasks."build:core"]
description = "Build core package"
run = "pnpm run build:core"

[tasks."build:mcp"]
description = "Build MCP server"
run = "pnpm run build:mcp"

[tasks."build:api"]
description = "Build REST API"
run = "pnpm run build:api"

[tasks."dev:api"]
description = "Start REST API dev server"
run = "pnpm run dev:api"

[tasks.clean]
description = "Clean all dist folders"
run = "pnpm run clean"

[tasks.lint]
description = "Run linter"
run = "pnpm run lint"

[tasks."test-alle"]
description = "Gesamt-Testlauf P25-T1: alle Tests gegen synapse_test (Node 25 ueber mise; Optionen nach --)"
run = "mise exec node@25 -- node scripts/test-alle.mjs"

[tasks."test-alle:betroffene"]
description = "Gesamt-Testlauf nur fuer geaenderte Pakete gegen origin/main"
run = "mise exec node@25 -- node scripts/test-alle.mjs --nur-betroffene"

[tasks."test-alle:liste"]
description = "Gesamt-Testlauf: nur finden und einordnen, nichts ausfuehren"
run = "mise exec node@25 -- node scripts/test-alle.mjs --liste"

[tasks."skills-seed"]
description = "Seed-Skills (Fall-Skills) laden: fehlende anlegen, vorhandene ueberspringen"
run = "node scripts/skills-seed-laden.mjs --laden"

[tasks."skills-seed:pruefen"]
description = "Seed-Skills pruefen (ohne API)"
run = "node scripts/skills-seed-laden.mjs --pruefen"
