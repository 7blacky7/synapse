<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">Workspaces · Zustände und Quelltext</title><desc id="desc">Lazy Docker-Lebenszyklus; PostgreSQL-Zustände cold warming active stopping error; Pin schützt vor Idle/LRU. Vollmaterialisierung und Exec sind getrennt. Quellen: packages/rest-api/src/services/workspace-orchestrator.ts:100-220,258-393,494-598,603-652,750-781,1007-1025,1135-1179.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f0883e"/></marker></defs>
<rect width="1200" height="1120" rx="16" fill="#0d1117"/>
<g font-family="DejaVu Sans, sans-serif" fill="#e6edf3">
<text x="40" y="54" font-size="32" font-weight="700" fill="#f0883e">Workspaces · Zustände und Quelltext</text>
<text x="40" y="91" font-size="18" fill="#b1bac4">Container werden bei Bedarf gestartet; Materialisierung ist ein eigener Schritt.</text>
<g><rect x="40" y="145" width="280" height="110" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="60" y="177" font-size="22" font-weight="700" fill="#f0883e">cold</text><text x="60" y="209" font-size="18">Kein aktiver Container</text><text x="60" y="234" font-size="18">Startbedarf / neuer Versuch</text></g><g><rect x="460" y="145" width="280" height="110" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="480" y="177" font-size="22" font-weight="700" fill="#f0883e">warming</text><text x="480" y="209" font-size="18">Volumes und Start</text><text x="480" y="234" font-size="18">Container vorbereiten</text></g><g><rect x="880" y="145" width="280" height="110" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="900" y="177" font-size="22" font-weight="700" fill="#f0883e">active</text><text x="900" y="209" font-size="18">Docker-Zustand geprüft</text><text x="900" y="234" font-size="18">Shell-Exec kann prüfen</text></g><path d="M320 200H460" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="180" font-size="16" text-anchor="middle" paint-order="stroke" stroke="#0d1117" stroke-width="7" stroke-linejoin="round">Bedarf</text><path d="M740 200H880" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="810" y="180" font-size="16" text-anchor="middle" paint-order="stroke" stroke="#0d1117" stroke-width="7" stroke-linejoin="round">Start gelingt</text><g><rect x="460" y="355" width="280" height="115" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="480" y="387" font-size="22" font-weight="700" fill="#f0883e">error</text><text x="480" y="419" font-size="18">Startfehler in last_error</text><text x="480" y="444" font-size="18">Neuer Bedarf: versuchen</text></g><path d="M600 255V355" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="670" y="310" font-size="16" text-anchor="middle" paint-order="stroke" stroke="#0d1117" stroke-width="7" stroke-linejoin="round">Startfehler</text><path d="M460 410H390V235H460" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="430" y="320" font-size="16" text-anchor="middle" paint-order="stroke" stroke="#0d1117" stroke-width="7" stroke-linejoin="round">erneut</text><g><rect x="880" y="355" width="280" height="115" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="900" y="387" font-size="22" font-weight="700" fill="#f0883e">stopping</text><text x="900" y="419" font-size="18">Idle · LRU · manuell</text><text x="900" y="444" font-size="18">Container entfernen</text></g><path d="M1020 255V355" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1092" y="310" font-size="16" text-anchor="middle" paint-order="stroke" stroke="#0d1117" stroke-width="7" stroke-linejoin="round">Stopp</text><path d="M1020 470V515H350V280H180V255" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="543" font-size="16" text-anchor="middle" paint-order="stroke" stroke="#0d1117" stroke-width="7" stroke-linejoin="round">cold; Projekt- und Home-Volumes bleiben erhalten</text><g><rect x="40" y="355" width="280" height="115" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="60" y="387" font-size="22" font-weight="700" fill="#f0883e">Docker fehlt</text><text x="60" y="419" font-size="18">Workspace nicht verfügbar</text><text x="60" y="444" font-size="18">REST-API bleibt nutzbar</text></g><g><rect x="40" y="570" width="530" height="130" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2" stroke-dasharray="3 4"/><text x="60" y="602" font-size="22" font-weight="700" fill="#f0883e">PostgreSQL · Quelle</text><text x="60" y="634" font-size="18">Dateiinhalte, Workspace-Zustand, Konfiguration</text><text x="60" y="659" font-size="18">Vollmaterialisierung und Änderungsereignisse</text></g><g><rect x="630" y="570" width="530" height="130" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="650" y="602" font-size="22" font-weight="700" fill="#f0883e">Projekt-Volume /workspace</text><text x="650" y="634" font-size="18">Zwischen Workspaces geteilt; Dateien 0444</text><text x="650" y="659" font-size="18">Home je Workspace separat und persistent</text></g><path d="M570 630H630" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="40" y="770" width="530" height="155" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="60" y="802" font-size="22" font-weight="700" fill="#f0883e">Materialisierung</text><text x="60" y="834" font-size="18">PG-Inhalte filtern und als Archiv übertragen</text><text x="60" y="859" font-size="18">Vorhandenen Container nutzen, sonst main starten</text><text x="60" y="884" font-size="18">Änderungsereignisse: inkrementell in aktive Container</text><text x="60" y="909" font-size="18">Start oder Exec allein ist keine Vollmaterialisierung</text></g><g><rect x="630" y="770" width="530" height="155" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="650" y="802" font-size="22" font-weight="700" fill="#f0883e">Shell im aktiven Container</text><text x="650" y="834" font-size="18">Native Lage → Startentscheidung → Benutzerbefehl</text><text x="650" y="859" font-size="18">Antwort synchron; kein lokales Detach/Stream-Modell</text><text x="650" y="884" font-size="18">Root-Dateisystem geschützt, Ressourcen begrenzt</text><text x="650" y="909" font-size="18">Konfiguriertes Docker-Netz; nicht allgemein netzlos</text></g><path d="M305 700V770" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M895 700V770" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="977" font-size="18">Pin schützt vor Idle/LRU, nicht vor manuellem Stopp. Ohne LRU-Kandidat kann die Grenze überschritten werden.</text>
<text x="40" y="1008" font-size="18">Standard: 5 parallel · Idle nach 10 min, Prüfung jede Minute · 6 angelegte Instanzen je Projekt.</text>
<text x="40" y="1060" font-size="16" fill="#b1bac4">Legende: durchgezogene Rahmen = Zustände/Komponenten; gepunkteter Rahmen = Datenspeicher.</text>
<text x="40" y="1090" font-size="16" fill="#b1bac4">Durchgezogene Pfeile = Zustandsübergang oder Daten-/Verarbeitungspfad; grau = erläuternder Text.</text>
</g></svg>
