<text x="42" y="348" font-size="20" font-weight="700" fill="#f0883e">2 · Ein Claim vergibt einen Chunk an genau einen aktiven Bearbeiter</text>
<g><rect x="42" y="374" width="360" height="146" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="62" y="410" font-size="21" font-weight="700">Claim in PostgreSQL</text><text x="62" y="440" font-size="17">Token · Knoten-ID</text><text x="62" y="468" font-size="17">Lease · Kapazitätsgrenze</text><text x="62" y="490" font-size="15" fill="#b1bac4">abgelaufene Claims sind</text><text x="62" y="508" font-size="15" fill="#b1bac4">neu vergebbar</text></g>
<g><rect x="422" y="366" width="320" height="126" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="442" y="402" font-size="21" font-weight="700">Server-Worker</text><text x="442" y="432" font-size="17">konfigurierter Provider</text><text x="442" y="460" font-size="16" fill="#b1bac4">gleicher Claim-/Abschlussvertrag</text></g>
