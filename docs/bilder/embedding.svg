<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
<title id="title">Code-Indexierung und Embedding-Claims</title>
<desc id="desc">Änderungen laufen über Parser-Worker und Pool in Symbole und Chunks in PostgreSQL. Offene Chunks erhalten Token und Lease; Server-Worker oder Compute-Node berechnen Vektoren. Der Server prüft Dimension, Hash, Besitzer, Token und Lease, schreibt gültige Vektoren nach Qdrant und quittiert PostgreSQL. Quellen: packages/rest-api/src/services/parser-worker.ts:155-230,240-286; packages/core/src/services/code.ts:1240-1335,1350-1450; packages/core/src/services/embedding-claims.ts:175-310,440-560; packages/compute-node-agent/src/index.ts:205-260,410-555; packages/core/src/embeddings/index.ts:250-330.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f0883e"/></marker></defs>
<rect width="1400" height="930" rx="18" fill="#0d1117"/>
<g font-family="DejaVu Sans, sans-serif" fill="#e6edf3">
<text x="42" y="54" font-size="32" font-weight="700" fill="#f0883e">Code-Indexierung · vom Dateiinhalt zum Suchvektor</text>
<text x="42" y="88" font-size="18" fill="#b1bac4">Parserdaten sind in PostgreSQL nutzbar, bevor die Hintergrund-Einbettung abgeschlossen ist.</text>
<text x="42" y="132" font-size="20" font-weight="700" fill="#f0883e">1 · Text wird strukturiert und in Chunks zerlegt</text>
<g><rect x="42" y="156" width="270" height="132" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="62" y="190" font-size="21" font-weight="700">Änderung / Backlog</text><text x="62" y="220" font-size="17">Datei in PostgreSQL</text><text x="62" y="248" font-size="16" fill="#b1bac4">lokaler Watcher oder REST</text></g>
<g><rect x="386" y="156" width="270" height="132" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="406" y="190" font-size="21" font-weight="700">Parser-Worker</text><text x="406" y="220" font-size="17">Sprache wählen · parse()</text><text x="406" y="248" font-size="16" fill="#b1bac4">Pool begrenzt Worker-Threads</text></g>
<g><rect x="730" y="156" width="270" height="132" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2" stroke-dasharray="3 4"/><text x="750" y="190" font-size="21" font-weight="700">PostgreSQL</text><text x="750" y="220" font-size="17">Symbole · Referenzen</text><text x="750" y="248" font-size="17">Statements · Call-Kanten</text></g>
<g><rect x="1074" y="156" width="284" height="132" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2" stroke-dasharray="3 4"/><text x="1094" y="190" font-size="21" font-weight="700">code_chunks</text><text x="1094" y="220" font-size="17">Text · Hash · Dateipfad</text><text x="1094" y="248" font-size="16" fill="#b1bac4">embedded_at zunächst leer</text></g>
