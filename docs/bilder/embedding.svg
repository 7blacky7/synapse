<g><rect x="42" y="736" width="392" height="112" rx="12" fill="#161b22" stroke="#30363d"/><text x="62" y="770" font-size="17" font-weight="700">Lease abgelaufen</text><text x="62" y="795" font-size="16" fill="#b1bac4">Der offene Chunk kann erneut</text><text x="62" y="819" font-size="16" fill="#b1bac4">geclaimt werden.</text></g>
