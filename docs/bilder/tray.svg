<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1040" viewBox="0 0 1120 1040" role="img" aria-labelledby="title desc">
<title id="title">Tray: vom Klick zum aktualisierten Status</title><desc id="desc">Go-Tray und Moo-Tray sind getrennte Prozesse. Go entdeckt den lokalen Daemon, aktualisiert per SSE und Polling, nutzt die zentrale API und teilweise PG-Leserückfälle. Moo aktualisiert sein Menü durch Aktionen und liest PG direkt.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#f0883e"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e6edf3;font-size:18px}.title{font-size:30px;fill:#f0883e;font-weight:700}.head{font-size:22px;fill:#f0883e;font-weight:650}.muted{fill:#b1bac4}.edge{fill:none;stroke:#f0883e;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1120" height="1040" rx="16" fill="#0d1117"/>
<text x="40" y="49" class="title">Tray: vom Klick zum aktualisierten Status</text><text x="40" y="82" class="muted">Lokaler Daemon, zentrale API und Datenbank haben getrennte Erreichbarkeit.</text>
<rect x="40" y="110" width="320" height="135" rx="12" fill="#161b22" stroke="#f0883e"/><text x="60" y="144" class="head">Start des Go-Trays</text><text x="60" y="177">tray.lock: Instanzschutz</text><text x="60" y="204">Unix: Vorgänger übernehmen</text><text x="60" y="231">Windows: Zweitstart endet</text>
<rect x="400" y="110" width="320" height="135" rx="12" fill="#161b22" stroke="#f0883e"/><text x="420" y="144" class="head">Discovery</text><text x="420" y="177">daemon.port → lokaler Port</text><text x="420" y="204">config.json + Umgebung</text><text x="420" y="231" class="muted">Standard-Port: 7878</text>
<rect x="760" y="110" width="320" height="135" rx="12" fill="#161b22" stroke="#f0883e"/><text x="780" y="144" class="head">Statusabfrage</text><text x="780" y="177">GET /projects</text><text x="780" y="204">Gültige Antwort → online</text><text x="780" y="231">Sonst → Daemon offline</text>
<path class="edge" d="M360 177H397"/><path class="edge" d="M720 177H757"/>
<rect x="40" y="295" width="440" height="265" rx="12" fill="#161b22" stroke="#f0883e"/><text x="60" y="329" class="head">Go-Tray · eigener UI-Prozess</text><text x="60" y="362">Klick → Anfrage → Refresh</text><text x="60" y="389">SSE-Daten stoßen Refresh an</text><text x="60" y="416">Polling: 1 s / mit SSE 10 s</text><text x="60" y="443">Menü neu bei Strukturwechsel</text><text x="60" y="470">Nur Aktiv-Flag? Kleines Update</text><text x="60" y="497" class="muted">Sichtbare Fenster: eigener 3-s-Takt</text>
<rect x="640" y="295" width="440" height="115" rx="12" fill="#161b22" stroke="#f0883e"/><text x="660" y="329" class="head">Lokaler TS-Daemon</text><text x="660" y="362">Projektaktionen über HTTP</text><text x="660" y="389">Zustandsänderung → SSE</text>
<path class="edge" d="M480 325H637"/><path class="edge" d="M640 382H483"/>
<text x="504" y="316" class="muted">Aktion</text><text x="523" y="405" class="muted">SSE</text>
<rect x="640" y="450" width="440" height="145" rx="12" fill="#161b22" stroke="#f0883e"/><text x="660" y="484" class="head">Zentrale Synapse-API</text><text x="660" y="517">Daten, Workspaces, Chat</text><text x="660" y="544">Adressrückfall bei Transport/5xx</text><text x="660" y="571">4xx / Redirect → echter Fehler</text>
<path class="edge" d="M480 495H637"/><text x="510" y="485" class="muted">HTTP</text>
<rect x="40" y="625" width="440" height="145" rx="12" fill="#161b22" stroke="#f0883e"/><text x="60" y="659" class="head">Starten / Deaktivieren</text><text x="60" y="692">start-requested / stop-requested</text><text x="60" y="719">Starthelfer liest alle 2 s</text><text x="60" y="746" class="muted">Steuerdatei allein startet nichts</text>
<rect x="640" y="625" width="440" height="145" rx="12" fill="#161b22" stroke="#f0883e" stroke-dasharray="3 4"/><text x="660" y="659" class="head">PostgreSQL</text><text x="660" y="692">Go: verbleibende Leserückfälle</text><text x="660" y="719">z. B. Agenten und Nachrichten</text><text x="660" y="746" class="muted">Kein Offline-Schreibspeicher</text>
<path d="M480 535H555V670H637" class="edge" stroke-dasharray="3 4"/>
<text x="565" y="616" class="muted">Leserückfall</text>
<rect x="40" y="805" width="1040" height="155" rx="12" fill="#161b22" stroke="#f0883e" stroke-dasharray="3 4"/><text x="60" y="839" class="head">Moo-Tray · separate Anwendung</text><text x="60" y="872">Listen direkt aus PG; Projektaktionen und Chat-Schreiben über den Daemon.</text><text x="60" y="899">Menü: Start / Neu laden / eigene Aktion. Kein periodischer Menü-Timer.</text><text x="60" y="926">Offene Chats: eigener 3-s-Timer. Go-SSE und Go-Discovery gelten hier nicht.</text>
<text x="40" y="1004" class="muted">Durchgezogen: regulärer Weg · Kurz gestrichelt: ergänzender Datenzugriff / eigene Variante</text></svg>
