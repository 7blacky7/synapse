<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">Dateiänderungen · Entwurf, Commit und Platte</title>
<desc id="desc">Ein Plan erzeugt einen Schattenstand; Prüfung und Co-Edit-Gate gehen der Übernahme in PostgreSQL voraus. Gemeinsamer Commit: eine Transaktion; älterer Batchpfad: dateiweise. Der lokale Daemon synchronisiert danach. Die Plattenprobe ist eine eigene Bestätigung. Quellen: packages/core/src/services/file-batch.ts:90-142,1932-2286,2399-2468,4701-4774; file-fs-drift.ts:21-89; file-versions.ts:267-303,417-435; packages/core/src/watcher/index.ts:459-610.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f0883e"/></marker></defs>
<rect width="1400" height="980" rx="16" fill="#0d1117"/>
<g font-family="DejaVu Sans, sans-serif" fill="#e6edf3">
<text x="40" y="55" font-size="32" font-weight="700" fill="#f0883e">Dateiänderungen · Entwurf, Commit und Platte</text>
<text x="40" y="94" font-size="18" fill="#b1bac4">Der Entwurf verändert noch keine Datei. PostgreSQL-Commit und Plattenstand werden getrennt bestätigt.</text>
<text x="40" y="137" font-size="20" font-weight="700" fill="#f0883e">Normalpfad</text>
<g><rect x="40" y="160" width="240" height="130" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="58" y="194" font-size="21" font-weight="700" fill="#f0883e">Operation</text><text x="58" y="225" font-size="18">Projektpfad · Task</text><text x="58" y="250" font-size="18">Text- / Zeilenanker</text></g>
<g><rect x="310" y="160" width="240" height="130" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="328" y="194" font-size="21" font-weight="700" fill="#f0883e">Plan / Schatten</text><text x="328" y="225" font-size="18">Trockenlauf · Diff</text><text x="328" y="250" font-size="18">Basis-Hashes</text></g>
<g><rect x="580" y="160" width="240" height="130" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="598" y="194" font-size="21" font-weight="700" fill="#f0883e">Commit-Prüfung</text><text x="598" y="225" font-size="18">Befunde · FS-Drift</text><text x="598" y="250" font-size="18">Ready · PG-Hashes</text></g>
<g><rect x="850" y="160" width="240" height="130" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2" stroke-dasharray="3 4"/><text x="868" y="194" font-size="21" font-weight="700" fill="#f0883e">PostgreSQL</text><text x="868" y="225" font-size="18">code_files + Versionen</text><text x="868" y="250" font-size="18">Status: committed</text></g>
<g><rect x="1120" y="160" width="240" height="130" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="1138" y="194" font-size="21" font-weight="700" fill="#f0883e">Lokaler Daemon</text><text x="1138" y="225" font-size="18">PG→FS-Poller</text><text x="1138" y="250" font-size="18">Hashabgleich → Platte</text></g>
<path d="M280 225H310" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550 225H580" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M820 225H850" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1090 225H1120" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M430 290V350" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1240 290V350" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/>
<g><rect x="40" y="350" width="680" height="160" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="58" y="384" font-size="21" font-weight="700" fill="#f0883e">Co-Edit im offenen Plan</text><text x="58" y="415" font-size="18">Beiträge → gemeinsamer Schatten → Ready-Gate</text><text x="58" y="440" font-size="18">Aktiv, noch nicht ready/no_changes: Plan bleibt offen.</text><text x="58" y="465" font-size="18">Inaktive blockieren nicht; Konflikte verhindern den Commit.</text></g>
<g><rect x="760" y="350" width="600" height="160" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="778" y="384" font-size="21" font-weight="700" fill="#f0883e">Plattenprobe: wait_sync</text><text x="778" y="415" font-size="18">Daemon liest den Stand und vergleicht den Ergebnis-Hash.</text><text x="778" y="440" font-size="18">auf_platte: ja / nein / unbekannt</text><text x="778" y="465" font-size="18">nein oder unbekannt: PG-Commit bleibt bestehen.</text></g>
<rect x="40" y="550" width="1320" height="80" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
<text x="60" y="581" font-size="20" font-weight="700" fill="#f0883e">Abzweige vor dem Datei-Commit</text>
<text x="60" y="610" font-size="18">Befund / fs_drift → offen, nichts geschrieben. Anderer PG-Hash → stale. Überlappende Autorenbereiche → conflict.</text>
<text x="40" y="685" font-size="20" font-weight="700" fill="#f0883e">Versionierung und späterer Rückweg</text>
<g><rect x="40" y="710" width="390" height="140" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2" stroke-dasharray="3 4"/><text x="58" y="744" font-size="21" font-weight="700" fill="#f0883e">file_versions</text><text x="58" y="775" font-size="18">Vorher-Inhalt · Autor · Task</text><text x="58" y="800" font-size="18">batch_id verbindet den Commit</text></g>
<g><rect x="505" y="710" width="390" height="140" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="523" y="744" font-size="21" font-weight="700" fill="#f0883e">Restore</text><text x="523" y="775" font-size="18">Neuer Schreibvorgang</text><text x="523" y="800" font-size="18">Der bisherige Stand wird gesichert.</text></g>
<g><rect x="970" y="710" width="390" height="140" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2" stroke-dasharray="3 4"/><text x="988" y="744" font-size="21" font-weight="700" fill="#f0883e">Aktueller PG-Stand</text><text x="988" y="775" font-size="18">Gewählte Version wird aktuell.</text><text x="988" y="800" font-size="18">Danach wieder PG→FS-Sync.</text></g>
<path d="M430 780H505" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M895 780H970" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="885" font-size="18" fill="#b1bac4">Gemeinsamer Commit: eine PG-Transaktion. Älterer Batchpfad und Batch-Restore: dateiweise.</text>
<path d="M40 915H1360" stroke="#30363d"/>
<text x="40" y="945" font-size="17" fill="#b1bac4">Legende: durchgezogen = Verarbeitung · kurz gepunktet = persistente PG-Daten · Pfeile = Ablauf / Datenübernahme</text>
</g></svg>
