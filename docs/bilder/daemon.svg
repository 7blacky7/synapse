<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc">
<title id="title">TypeScript-Daemon: Platte, PG und Aufträge</title><desc id="desc">Der Daemon startet aus lokaler Konfiguration, gleicht die Host-Registry ab und betreibt getrennte Sync-Richtungen zwischen Dateisystem und PostgreSQL. Job-Worker claimen Aufträge, Heartbeats melden aktive Projekte. Pausen und Shutdown haben eigene Grenzen.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#f0883e"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e6edf3;font-size:18px}.title{font-size:30px;fill:#f0883e;font-weight:700}.head{font-size:22px;fill:#f0883e;font-weight:650}.muted{fill:#b1bac4}.edge{fill:none;stroke:#f0883e;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1120" height="1080" rx="16" fill="#0d1117"/>
<text x="40" y="49" class="title">TypeScript-Daemon: Platte, PG und Aufträge</text><text x="40" y="82" class="muted">Eigener lokaler Prozess · HTTP nur an Loopback · PostgreSQL als gemeinsamer Bestand</text>
<rect x="40" y="110" width="320" height="138" rx="12" fill="#161b22" stroke="#f0883e"/><text x="60" y="144" class="head">Start und Discovery</text><text x="60" y="177">PID prüfen → Config laden</text><text x="60" y="204">Lokale API starten</text><text x="60" y="231">daemon.pid / daemon.port</text>
<rect x="400" y="110" width="320" height="138" rx="12" fill="#161b22" stroke="#f0883e"/><text x="420" y="144" class="head">Enabled-Registry</text><text x="420" y="177">PG-Abgleich: Start + 10 s</text><text x="420" y="204">Host + vorhandener Pfad</text><text x="420" y="231">Watcher starten / stoppen</text>
<rect x="760" y="110" width="320" height="138" rx="12" fill="#161b22" stroke="#f0883e"/><text x="780" y="144" class="head">Rückmeldung</text><text x="780" y="177">HTTP-Status + SSE an Tray</text><text x="780" y="204">Heartbeat: aktive Projekte</text><text x="780" y="231">PG-Ausfall: Config bleibt</text>
<path class="edge" d="M360 175H397"/><path class="edge" d="M720 175H757"/>
<rect x="40" y="310" width="280" height="350" rx="12" fill="#161b22" stroke="#f0883e"/><text x="60" y="344" class="head">Lokale Platte</text><text x="60" y="377">Projektverzeichnis</text><text x="60" y="404">Startscan</text><text x="60" y="431">add / change / unlink</text><text x="60" y="458">Ignore + Klassifikation</text><text x="60" y="485"></text><text x="60" y="512">Neue PG-Inhalte</text><text x="60" y="539">Datei schreiben</text><text x="60" y="566">PG-Löschung anwenden</text>
<rect x="420" y="310" width="280" height="350" rx="12" fill="#161b22" stroke="#f0883e"/><text x="440" y="344" class="head">Daemon + Core</text><text x="440" y="377">FS → PG: Indexier-Slots</text><text x="440" y="404">Inhalt / Entfernen</text><text x="440" y="431">Code, Dokument, Asset</text><text x="440" y="458"></text><text x="440" y="485">PG → FS: 2-s-Poll</text><text x="440" y="512">Delta + Vollabgleich</text><text x="440" y="539">Hash- / Pfadprüfung</text>
<rect x="800" y="310" width="280" height="350" rx="12" fill="#161b22" stroke="#f0883e"/><text x="820" y="344" class="head">PostgreSQL</text><text x="820" y="377">Projekt-Registry</text><text x="820" y="404">Dateibestand</text><text x="820" y="431">Frühere Versionen</text><text x="820" y="458"></text><text x="820" y="485">Änderungen + Löschungen</text><text x="820" y="512">Job-Queues + Ergebnisse</text><text x="820" y="539">Daemon-Heartbeats</text>
<path class="edge" d="M320 408H417"/><path class="edge" d="M700 408H797"/>
<text x="342" y="397" class="muted">Event</text><text x="722" y="397" class="muted">Inhalt</text>
<path class="edge" d="M800 566H703"/><path class="edge" d="M420 566H323"/>
<text x="725" y="592" class="muted">Poll</text><text x="334" y="592" class="muted">Sync</text>
<rect x="40" y="698" width="1040" height="115" rx="12" fill="#161b22" stroke="#f0883e" stroke-dasharray="3 4"/><text x="60" y="732" class="head">Schutz beim PG → Platte-Schreiben</text><text x="60" y="765">Gleicher Hash: nichts tun. Bekannte frühere Version: aktualisieren.</text><text x="60" y="792">Unbekannter lokaler Inhalt: stehen lassen. PG gespeichert ≠ auf Platte angekommen.</text>
<rect x="40" y="850" width="320" height="153" rx="12" fill="#161b22" stroke="#f0883e"/><text x="60" y="884" class="head">Job-Verarbeitung</text><text x="60" y="917">Benachrichtigung + 10-s-Poll</text><text x="60" y="944">pending → Claim → Ausführung</text><text x="60" y="971">Ergebnis / Fehler nach PG</text>
<rect x="400" y="850" width="320" height="153" rx="12" fill="#161b22" stroke="#f0883e"/><text x="420" y="884" class="head">Pause</text><text x="420" y="917">Sync-Richtungen getrennt</text><text x="420" y="944">Neue Job-Claims warten</text><text x="420" y="971">Laufende Shell bleibt aktiv</text>
<rect x="760" y="850" width="320" height="153" rx="12" fill="#161b22" stroke="#f0883e"/><text x="780" y="884" class="head">Shutdown</text><text x="780" y="917">API / Worker / Watcher aus</text><text x="780" y="944">Discovery-Dateien entfernen</text><text x="780" y="971">Nach 5 s: hartes Ende</text>
<text x="40" y="1048" class="muted">Vollabgleich standardmäßig alle 5 min, 500 Dateien je Seite · Sync-Pause ist kein dauerhaftes Journal.</text></svg>
