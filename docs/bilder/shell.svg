 x="630" y="690" width="530" height="145" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="650" y="722" font-size="22" font-weight="700" fill="#f0883e">Benutzerbefehl startet</text><text x="650" y="754" font-size="18">Lokal: Queue/Prozess · Workspace: Docker-Exec</text><text x="650" y="779" font-size="18">20 s lokal: Antwort früh, Prozess läuft weiter</text><text x="650" y="804" font-size="18">Workspace-Timeout ist kein gesicherter Prozessstopp</text></g><path d="M295 835V880H305V905" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M895 835V905" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="40" y="905" width="530" height="115" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="60" y="937" font-size="22" font-weight="700" fill="#f0883e">Audit und gespeicherter Zustand</text><text x="60" y="969" font-size="18">Sicherungsentscheidung und Ergebnis maskiert</text><text x="60" y="994" font-size="18">Job-UUID ≠ lokale stream_id</text></g><g><rect x="630" y="905" width="530" height="115" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="650" y="937" font-size="22" font-weight="700" fill="#f0883e">Ausgabe und Laufzeit</text><text x="650" y="969" font-size="18">Maskierte Antwort; lokaler Stream-Puffer</text><text x="650" y="994" font-size="18">Abbruch und harte Grenze beenden lokal</text></g><path d="M630 962H570" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="1060" font-size="16" fill="#b1bac4">Legende: durchgezogene Rahmen = Verarbeitungsschritte; Pfeile = Ablauf oder Ergebnisweg.</text>
<text x="40" y="1090" font-size="16" fill="#b1bac4">Bestätigung und Anzeigeausnahme sind rollenbeschränkt. Maskierte Persistenz bleibt bestehen.</text>
