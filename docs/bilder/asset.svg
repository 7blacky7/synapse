<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Asset-Intel · vom Datei-Ereignis zu Metadaten</title>
<desc id="desc">Lokale Watcher-Ereignisse und Startabgleich führen markierte Dateien in eine begrenzte, zusammengeführte Queue. Ein Worker nutzt Registry, Magic Bytes, begrenzten Bytezugriff und Inspektorgrenzen. PostgreSQL speichert Asset-Dateien, Objekte und Verweise; Abfragen lesen daraus Baum, Suche und Graph. Quellen: packages/core/src/services/asset-intel-sync.ts:90-180,245-320,400-480; packages/core/src/asset-intel/registry.ts:1-80; packages/core/src/asset-intel/run.ts:1-140; packages/core/src/asset-intel/worker-runner.ts:1-65,100-220; packages/core/src/services/asset-intel-store.ts:1-45; packages/core/src/services/asset-intel-abfragen.ts:1-35.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f0883e"/></marker></defs>
<rect width="1400" height="900" rx="18" fill="#0d1117"/>
<g font-family="DejaVu Sans, sans-serif" fill="#e6edf3">
<text x="42" y="54" font-size="32" font-weight="700" fill="#f0883e">Asset-Intel · von der Datei zu strukturierten Verweisen</text>
<text x="42" y="88" font-size="18" fill="#b1bac4">Ein lokaler, begrenzter Metadatenpfad neben dem Textindex; Originaldateien bleiben unverändert.</text>
<text x="42" y="136" font-size="20" font-weight="700" fill="#f0883e">1 · Ereignis oder Startabgleich führt eine Datei zur Inspektion</text>
<g><rect x="42" y="160" width="260" height="130" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2" stroke-dasharray="7 5"/><text x="62" y="196" font-size="21" font-weight="700">Dateisystem</text><text x="62" y="226" font-size="17">add · change · unlink</text><text x="62" y="250" font-size="15" fill="#b1bac4">oder Verify beim</text><text x="62" y="272" font-size="15" fill="#b1bac4">Watcherstart</text></g>
<g><rect x="366" y="160" width="260" height="130" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="386" y="196" font-size="21" font-weight="700">Binär-Weiche</text><text x="386" y="226" font-size="17">event.asset entscheidet</text><text x="386" y="250" font-size="15" fill="#b1bac4">Textparser bleibt</text><text x="386" y="272" font-size="15" fill="#b1bac4">eigener Pfad</text></g>
<g><rect x="690" y="160" width="260" height="130" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="710" y="196" font-size="21" font-weight="700">Asset-Queue</text><text x="710" y="226" font-size="17">begrenzt · 1 bis 2 Worker</text><text x="710" y="250" font-size="15" fill="#b1bac4">gleicher Projektpfad</text><text x="710" y="272" font-size="15" fill="#b1bac4">wird gebündelt</text></g>
<g><rect x="1014" y="160" width="344" height="130" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="1034" y="196" font-size="21" font-weight="700">Inspektor-Worker</text><text x="1034" y="226" font-size="17">Magic Bytes → Endung</text><text x="1034" y="254" font-size="16" fill="#b1bac4">begrenzte, schreibgeschützte Bytes</text></g>
