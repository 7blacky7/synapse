<path d="M540 824H586" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="598" y="830" font-size="14" fill="#b1bac4">externe Grenze</text>
<text x="42" y="870" font-size="15" fill="#b1bac4">Format-Inspektion ist kein Medien-Embedding: multimodale Vektoren liegen in einer eigenen Qdrant-Collection.</text>
