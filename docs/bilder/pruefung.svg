<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1280" viewBox="0 0 1480 1280" role="img" aria-labelledby="title desc">
<title id="title">Syntaxprüfung und Erklärungsfälle</title>
<desc id="desc">Synchroner Schreibpfad mit Node-Worker und netzlosem Prüfcontainer, Fehler- und Timeout-Grenzen sowie asynchroner Erklärungsfall.</desc>
<defs>
  <marker id="arrow" markerWidth="28" markerHeight="28" markerUnits="userSpaceOnUse" refX="26" refY="14" orient="auto"><path d="M1 1 L27 14 L1 27 Z" fill="#f0883e"/></marker>
  <marker id="arrow-muted" markerWidth="28" markerHeight="28" markerUnits="userSpaceOnUse" refX="26" refY="14" orient="auto"><path d="M1 1 L27 14 L1 27 Z" fill="#b1bac4"/></marker>
  <style>
    text{font-family:"DejaVu Sans",sans-serif;fill:#e6edf3}
    .title{font-size:34px;font-weight:700;fill:#f0883e}.subtitle{font-size:19px;fill:#b1bac4}
    .head{font-size:22px;font-weight:650;fill:#f0883e}.body{font-size:18px}.small{font-size:16px;fill:#b1bac4}
    .card{fill:#161b22;stroke:#f0883e;stroke-width:2;rx:16}
    .core{fill:#161b22;stroke:#f0883e;stroke-width:3;rx:16}
    .line{fill:none;stroke:#f0883e;stroke-width:4;marker-end:url(#arrow)}
    .mutedline{fill:none;stroke:#b1bac4;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#arrow-muted)}
    .optional{fill:none;stroke:#f0883e;stroke-width:3;stroke-dasharray:3 4;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1480" height="1280" fill="#0d1117"/>
<text x="64" y="66" class="title">Syntaxprüfung am Schreibweg</text>
<text x="64" y="101" class="subtitle">Synchrones Prüftor und davon entkoppelter Erklärungsfall · schematischer Ablauf</text>

<!-- Synchronous write flow -->
<text x="64" y="157" class="head">1 · Änderung prüfen, bevor sie gespeichert wird</text>
<rect x="64" y="184" width="250" height="136" class="card"/>
<text x="88" y="222" class="head">Änderung</text>
<text x="88" y="254" class="body">Neue oder geänderte</text><text x="88" y="281" class="body">Dateifassung</text>
<path d="M314 252 H358" class="line"/>
<rect x="366" y="184" width="306" height="136" class="core"/>
<text x="390" y="222" class="head">Prüfer auswählen</text>
<text x="390" y="254" class="body">Endung / Dateiname</text><text x="390" y="281" class="body">Schweregrad · Prüferfamilie</text>
<path d="M672 252 H716" class="line"/>
<rect x="724" y="184" width="334" height="136" class="card"/>
<text x="748" y="222" class="head">Syntax ausführen</text>
<text x="748" y="254" class="body">Node-Worker-Pool</text><text x="748" y="281" class="small">oder Hauptthread · eigene Worker</text>
<path d="M1058 252 H1102" class="line"/>
<rect x="1110" y="184" width="306" height="136" class="core"/>
<text x="1134" y="222" class="head">Befunde bewerten</text>
<text x="1134" y="254" class="body">Position · Meldung</text><text x="1134" y="281" class="body">hart / Hinweis / teilweise</text>

<!-- Container extension -->
<rect x="724" y="355" width="334" height="142" class="card"/>
<text x="748" y="394" class="head">Prüfcontainer</text>
<text x="748" y="426" class="body">REST-API · Docker</text>
<text x="748" y="454" class="small">JSON-Zeilen · Netzwerk aus</text>
<text x="748" y="478" class="small">Text prüfen, nicht ausführen</text>
<path d="M1058 426 H1080 V300 H1102" class="optional"/>
<rect x="1110" y="355" width="306" height="174" class="card"/>
<text x="1134" y="394" class="head">Startgrenzen</text>
<text x="1134" y="426" class="small">Bedarfstart · Auftragsbudget</text>
<text x="1134" y="454" class="small">Timeouts · Neustart / Pause</text>
<text x="1134" y="478" class="small">Docker/Image fehlt →</text>
<text x="1134" y="501" class="small">nicht registriert</text>
<path d="M1058 426 H1102" class="mutedline"/>

<!-- Decision paths -->
<path d="M1263 320 H1440 V548 H382 V582" class="line"/>
<rect x="64" y="582" width="636" height="180" class="core"/>
<text x="92" y="623" class="head">Kein sperrender Befund</text>
<text x="92" y="658" class="body">Schreiben wird fortgesetzt und gespeichert.</text>
<text x="92" y="692" class="body">Eine begründete Quittierung wandelt den</text>
<text x="92" y="721" class="body">sperrenden Befund in einen Hinweis um.</text>
<rect x="780" y="582" width="636" height="180" class="core"/>
<text x="808" y="623" class="head">Sperrender Syntaxfehler</text>
<text x="808" y="658" class="body">Einzelschreibweg weist vor dem Schreiben ab.</text>
<text x="808" y="692" class="body">Plan-Commit kann durch harte Befunde</text>
<text x="808" y="721" class="body">gesperrt werden.</text>
<path d="M1263 548 V568 H1098 V576" class="line"/>

<!-- Non-guarantee -->
<rect x="64" y="798" width="1352" height="134" class="card"/>
<text x="90" y="838" class="head">Grenzen der Sperrwirkung</text>
<text x="90" y="872" class="body">Budget überschritten → Ergebnis teilweise; späterer Befund kommt als Hinweis nach, obwohl geschrieben wurde.</text>
<text x="90" y="902" class="body">Prüferfehler werden übersprungen. Fehlendes Docker/Image oder ausgeschalteter Schalter → Prüfer nicht registriert.</text>

<!-- Async explanation lane -->
<text x="64" y="990" class="head">2 · Erklärungsweg läuft unabhängig im Hintergrund</text>
<path d="M1416 670 H1440 V950 H40 V1105 H63" class="line"/>
<rect x="64" y="1010" width="272" height="190" class="card"/>
<text x="88" y="1050" class="head">Fehlerfall</text>
<text x="88" y="1084" class="body">asynchron einreihen</text>
<text x="88" y="1117" class="small">kein Warten auf Jev</text>
<text x="88" y="1146" class="small">maskiertes Ereignis</text>
<path d="M336 1105 H378" class="line"/>
<rect x="386" y="1010" width="310" height="190" class="card"/>
<text x="410" y="1050" class="head">Hintergrund-Worker</text>
<text x="410" y="1084" class="body">Ereignis dauerhaft sichern</text>
<text x="410" y="1117" class="body">passende Familie suchen</text>
<text x="410" y="1151" class="small">Schalter · Budget · Kandidaten</text>
<path d="M696 1105 H738" class="line"/>
<rect x="746" y="1010" width="310" height="190" class="core"/>
<text x="770" y="1050" class="head">Jev wählt</text>
<text x="770" y="1084" class="body">nur bei aktivem Topf</text>
<text x="770" y="1117" class="body">und geeigneten Kandidaten</text>
<text x="770" y="1151" class="small">Auswahl ab Confidence 0,7</text>
<path d="M1056 1105 H1098" class="line"/>
<rect x="1106" y="1010" width="310" height="190" class="card"/>
<text x="1130" y="1050" class="head">Ergebnis</text>
<text x="1130" y="1084" class="body">Erklärung oder offener Fall</text>
<text x="1130" y="1117" class="small">neuer Stand prüfen</text>
<text x="1130" y="1151" class="small">verifiziert → Fall schließen</text>
<text x="64" y="1245" class="small">Orange durchgezogen: synchroner Ablauf · orange gepunktet: alternativer Prüfpfad · grau lang gestrichelt: Containergrenze / nicht verfügbarer Prüfer</text>
</svg>