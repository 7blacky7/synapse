// Probe fuer den Scope-Stack-Absturz in groovy.ts (behoben, Parser-Version 4).
// Struktur aus einer echten Flutter-Plugin-Datei uebernommen:
// .plugin_symlinks/jni/example/android/build.gradle
//
// WORAUF ES ANKOMMT: MEHRERE aufeinander folgende Bloecke auf Modulebene.
// Solche Bloecke legen keinen eigenen Scope an und trugen deshalb scopeIdx 0;
// beim Schliessen leerte ss.splice(0) den kompletten Scope-Stapel samt
// Modul-Scope, und der naechste Zugriff auf cs().type warf einen TypeError.
// Mit nur EINEM Block am Dateiende faellt das nicht auf, weil danach kein
// Statement mehr folgt — genau daran ist der Fehler lange vorbeigelaufen.
// Diese Datei muss sich fehlerfrei parsen lassen.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Zweiter Teil: dieselbe Falle mit einer Klasse dazwischen. Hier zeigt sich der
// noch offene Restbefund — ein Block, der keinen eigenen Scope anlegt, schnitt
// den VORGEFUNDENEN Scope ab. Bei scopeIdx 0 war das der Absturz, bei scopeIdx 1
// ist es still: danachStehendeMethode verliert ihren Klassen-Scope.
class Helfer {
    String name

    String beschreibe() { name }

    String beschreibeZweimal() { name + name }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}
